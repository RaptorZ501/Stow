<div class="main">

    <!-- barre de recherche-->
    <div class="search-container">
        <h3>Recherche</h3>
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un stock...">
    </div>
    <!-- Le template n'est pas affiché à l'écran, il sert juste de modèle -->
    <template id="carte-template">
        <div class="carte">
            <div class="partie-sup">
                <img src="" alt="Photo" class="carte-img" />
                <div class="sup-droite">
                    <h2 class="carte-nom"></h2>
                    <div class="carte-infos">
                        <div class="carte-quantity-container">
                            <p class="carte-quantity"></p>
                        </div>
                        <div class="carte-modif-quantity-container">
                            <button class="btn-decrease">
                                -
                            </button>
                            <button class="btn-increase" id="btn-increase">
                                +
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="partie-inf">
                <button class="btn-details" id="btn-details">Details ></button>
            </div>
        </div>
    </template>

    <!-- C'est ici que les cartes vont s'afficher dynamiquement -->
    <div id="listeCartes" class="cartes-container">
    </div>
</div>
