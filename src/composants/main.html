<div class="main">

    <div class="search-container">
        <h3>Recherche</h3>
        <input type="text" id="searchInput" placeholder="Rechercher un stock...">
    </div>
    <!-- Le template n'est pas affiché à l'écran, il sert juste de modèle -->
    <template id="carte-template">
        <div class="carte">
            <img src="" alt="Photo" class="carte-img" />
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;width: 100%;">
                <h3 class="carte-nom"></h3>
                <div class="carte-infos">
                    <div class="carte-quantity-container">
                        <label for="quantity" style="font-weight: bold;">Quantité</label>
                        <p class="carte-quantity"></p>
                    </div>
                    <!--<p class="carte-category"></p>-->
                    <div class="carte-note-container">
                        <label for="note" style="font-weight: bold;">Note</label>
                        <p class="carte-note"></p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- C'est ici que les cartes vont s'afficher dynamiquement -->
    <div id="listeCartes" class="cartes-container">
    </div>
</div>
